<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charlotte Dance Classes — Every class, social & event in one place</title>
<meta name="description" content="A live calendar of salsa, bachata, zouk, kizomba, tango, swing and hip hop classes and socials across Charlotte, NC.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c1512;
    --paper:#efe6d3;
    --paper-dim:#e6dac1;
    --wine:#7a1533;
    --wine-deep:#5c0f26;
    --gold:#c99a3d;
    --coral:#e85d4c;
    --teal:#2c6e68;
    --line: rgba(28,21,18,0.14);
    --radius: 2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    font-weight:400;
    line-height:1.45;
  }
  h1,h2,.display{
    font-family:'Instrument Serif', serif;
    font-weight:400;
    letter-spacing:0.2px;
  }
  a{color:inherit;}

  /* Clave rhythm divider — a nod to the 2-3 son clave beat, used as a signature motif */
  .clave{
    display:flex;
    align-items:flex-end;
    gap:6px;
    height:18px;
    margin:0 auto;
  }
  .clave span{width:4px;background:var(--wine);border-radius:1px;}
  /* pattern: 1 0 0 1 0 0 1 0 -> tall,short,short,tall,short,short,tall,short */
  .clave span:nth-child(1){height:18px;}
  .clave span:nth-child(2){height:6px;opacity:.25;}
  .clave span:nth-child(3){height:6px;opacity:.25;}
  .clave span:nth-child(4){height:18px;}
  .clave span:nth-child(5){height:6px;opacity:.25;}
  .clave span:nth-child(6){height:6px;opacity:.25;}
  .clave span:nth-child(7){height:18px;}
  .clave span:nth-child(8){height:6px;opacity:.25;}

  header{
    padding:64px 24px 40px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }
  header .eyebrow{
    text-transform:uppercase;
    letter-spacing:2.5px;
    font-size:12px;
    color:var(--wine);
    font-weight:600;
    margin-bottom:18px;
  }
  header h1{
    font-size:clamp(36px,6vw,64px);
    margin:0 0 12px;
  }
  header h1 em{color:var(--wine);font-style:italic;}
  header p{
    max-width:520px;
    margin:0 auto 28px;
    color:rgba(28,21,18,0.7);
    font-size:16px;
  }

  main{max-width:960px;margin:0 auto;padding:40px 24px 100px;}

  .filters{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    margin-bottom:36px;
  }
  .filter-group{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .chip{
    padding:8px 16px;
    border:1px solid var(--line);
    border-radius:999px;
    background:transparent;
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    color:var(--ink);
    transition:all .15s ease;
  }
  .chip:hover{border-color:var(--wine);}
  .chip.active{background:var(--wine);border-color:var(--wine);color:var(--paper);}

  .day-nav{
    display:flex;
    overflow-x:auto;
    gap:0;
    border:1px solid var(--line);
    margin-bottom:32px;
  }
  .day-nav button{
    flex:1;
    min-width:64px;
    padding:12px 4px;
    background:none;
    border:none;
    border-right:1px solid var(--line);
    font-family:'Space Grotesk',sans-serif;
    font-size:12px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:1px;
    cursor:pointer;
    color:rgba(28,21,18,0.5);
  }
  .day-nav button:last-child{border-right:none;}
  .day-nav button.active{background:var(--ink);color:var(--paper);}

  .event-list{display:flex;flex-direction:column;gap:0;}
  .event{
    display:grid;
    grid-template-columns:80px 1fr auto;
    gap:20px;
    padding:22px 4px;
    border-bottom:1px solid var(--line);
    align-items:start;
  }
  .event-time{
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--wine);
    padding-top:3px;
  }
  .event-name{font-size:20px;margin:0 0 6px;font-family:'Instrument Serif',serif;}
  .event-meta{font-size:13px;color:rgba(28,21,18,0.65);margin:0 0 8px;}
  .event-tags{display:flex;gap:6px;flex-wrap:wrap;}
  .tag{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    padding:3px 9px;
    border-radius:999px;
    background:var(--paper-dim);
    border:1px solid var(--line);
    font-weight:600;
  }
  .tag.style-salsa{color:var(--wine);}
  .tag.style-bachata{color:var(--coral);}
  .tag.style-zouk{color:var(--teal);}
  .tag.style-kizomba{color:#8a5a2c;}
  .tag.style-tango{color:#4a4470;}
  .tag.style-swing{color:#4a7043;}
  .tag.style-hiphop{color:#b0405c;}
  .event-link{
    align-self:center;
    font-size:13px;
    font-weight:600;
    white-space:nowrap;
    border:1px solid var(--ink);
    padding:8px 14px;
    text-decoration:none;
    transition:all .15s ease;
  }
  .event-link:hover{background:var(--ink);color:var(--paper);}

  .empty{
    text-align:center;
    padding:60px 20px;
    color:rgba(28,21,18,0.55);
  }

  footer{
    text-align:center;
    padding:50px 24px 70px;
    border-top:1px solid var(--line);
  }
  footer p{font-size:14px;color:rgba(28,21,18,0.6);margin-bottom:18px;}
  .cta{
    display:inline-block;
    background:var(--wine);
    color:var(--paper);
    padding:14px 28px;
    text-decoration:none;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.3px;
  }
  .cta:hover{background:var(--wine-deep);}

  @media (max-width:560px){
    .event{grid-template-columns:56px 1fr;}
    .event-link{grid-column:1 / -1;justify-self:start;margin-top:8px;}
  }
</style>
</head>
<body>

<header>
  <div class="clave" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="eyebrow" style="margin-top:18px;">Charlotte, NC</div>
  <h1>Every class,<br><em>every night.</em></h1>
  <p>Salsa, bachata, zouk, kizomba, tango, swing & hip hop — every class and social in Charlotte, in one calendar.</p>
</header>

<main>
  <div class="filters">
    <div class="filter-group" id="style-filters">
      <button class="chip active" data-style="all">All styles</button>
      <button class="chip" data-style="salsa">Salsa</button>
      <button class="chip" data-style="bachata">Bachata</button>
      <button class="chip" data-style="zouk">Zouk</button>
      <button class="chip" data-style="kizomba">Kizomba</button>
      <button class="chip" data-style="tango">Tango</button>
      <button class="chip" data-style="swing">Swing</button>
      <button class="chip" data-style="hiphop">Hip Hop</button>
    </div>
    <div class="filter-group" id="audience-filters">
      <button class="chip active" data-audience="adult">Adult & Social</button>
      <button class="chip" data-audience="kids">Kids & Teens</button>
    </div>
  </div>

  <div class="day-nav" id="day-nav">
    <button class="active" data-day="all">All</button>
    <button data-day="Sun">Sun</button>
    <button data-day="Mon">Mon</button>
    <button data-day="Tue">Tue</button>
    <button data-day="Wed">Wed</button>
    <button data-day="Thu">Thu</button>
    <button data-day="Fri">Fri</button>
    <button data-day="Sat">Sat</button>
  </div>

  <div class="event-list" id="event-list">
    <div class="empty">Loading the calendar…</div>
  </div>
</main>

<footer>
  <p>Run a class, social, or event Charlotte dancers should know about?</p>
  <a class="cta" href="submit.html">Submit your event</a>
</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { firebaseConfig } from "./firebase-config.js";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let activeStyle = "all";
  let activeDay = "all";
  let activeAudience = "adult";
  let allEvents = [];

  async function loadEvents(){
    const q = query(collection(db, "events"), where("status", "==", "approved"));
    const snap = await getDocs(q);
    allEvents = [];
    snap.forEach(doc => allEvents.push({ id: doc.id, ...doc.data() }));
    // sensible default order: day of week, then time
    const dayOrder = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    allEvents.sort((a,b)=>{
      const da = dayOrder.indexOf(a.day), db_ = dayOrder.indexOf(b.day);
      if(da !== db_) return da - db_;
      return (a.time || "").localeCompare(b.time || "");
    });
    render();
  }

  function render(){
    const list = document.getElementById("event-list");
    const filtered = allEvents.filter(ev => {
      const styleMatch = activeStyle === "all" || (ev.styles || []).includes(activeStyle);
      const dayMatch = activeDay === "all" || ev.day === activeDay;
      const audienceMatch = activeAudience === "kids" ? ev.audience === "kids" : ev.audience !== "kids";
      return styleMatch && dayMatch && audienceMatch;
    });

    if(filtered.length === 0){
      list.innerHTML = `<div class="empty">Nothing matches yet — try a different filter, or <a href="submit.html">add an event</a> if you know of one.</div>`;
      return;
    }

    list.innerHTML = filtered.map(ev => `
      <div class="event">
        <div class="event-time">${ev.day || ""}<br>${ev.time || ""}</div>
        <div>
          <p class="event-name">${escapeHtml(ev.name || "")}</p>
          <p class="event-meta">${escapeHtml(ev.venue || "")}${ev.type === "recurring" ? " · Recurring" : " · One-time"}</p>
          <div class="event-tags">
            ${(ev.styles||[]).map(s => `<span class="tag style-${s}">${s}</span>`).join("")}
          </div>
        </div>
        ${ev.link ? `<a class="event-link" href="${escapeAttr(ev.link)}" target="_blank" rel="noopener">Details</a>` : "<span></span>"}
      </div>
    `).join("");
  }

  function escapeHtml(str){
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }
  function escapeAttr(str){
    return String(str).replace(/"/g,"&quot;");
  }

  document.getElementById("style-filters").addEventListener("click", e => {
    const btn = e.target.closest(".chip");
    if(!btn) return;
    document.querySelectorAll("#style-filters .chip").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    activeStyle = btn.dataset.style;
    render();
  });

  document.getElementById("audience-filters").addEventListener("click", e => {
    const btn = e.target.closest(".chip");
    if(!btn) return;
    document.querySelectorAll("#audience-filters .chip").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    activeAudience = btn.dataset.audience;
    render();
  });

  document.getElementById("day-nav").addEventListener("click", e => {
    const btn = e.target.closest("button");
    if(!btn) return;
    document.querySelectorAll("#day-nav button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    activeDay = btn.dataset.day;
    render();
  });

  loadEvents().catch(err => {
    document.getElementById("event-list").innerHTML =
      `<div class="empty">Couldn't load events. Check the Firebase config in firebase-config.js.<br><small>${err.message}</small></div>`;
    console.error(err);
  });
</script>

</body>
</html>
